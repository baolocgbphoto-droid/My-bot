<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O.S.A - AI Control Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; height: 100vh; box-sizing: border-box; }
        .chat-container { width: 100%; max-width: 600px; background: #1e1e1e; border-radius: 8px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; flex: 1; }
        .config-box { margin-bottom: 10px; display: flex; gap: 5px; }
        .config-box input { flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 12px; }
        .chat-box { flex: 1; overflow-y: auto; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 6px; max-width: 85%; line-height: 1.4; word-break: break-word; font-size: 14px; }
        .user { background: #007acc; color: white; align-self: flex-end; }
        .ai { background: #2d2d2d; color: #f1f1f1; align-self: flex-start; border: 1px solid #444; }
        .input-group { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: white; outline: none; }
        button { padding: 12px 18px; background: #007acc; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #005999; }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>O.S.A - Toàn Năng Dashboard</h2>
        <div class="config-box">
            <input type="password" id="apiKey" placeholder="Dán Gemini API Key vào đây...">
            <button onclick="saveKey()" style="background: #28a745; padding: 8px 12px; font-size: 12px;">Lưu Khóa</button>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="message ai">Xin chào! Hãy nhập Gemini API Key ở ô trên để kích hoạt bộ não thông minh cho tôi nhé.</div>
        </div>
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Nhập lệnh hoặc trò chuyện..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        if (apiKey) {
            document.getElementById('apiKey').value = apiKey;
        }

        function saveKey() {
            apiKey = document.getElementById('apiKey').value.trim();
            localStorage.setItem('gemini_api_key', apiKey);
            alert('Đã lưu API Key thành công!');
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            if (!apiKey) {
                alert('Vui lòng nhập và lưu Gemini API Key trước!');
                return;
            }

            appendMessage('user', text);
            input.value = '';

            const loadingId = 'loading_' + Date.now();
            const chatBox = document.getElementById('chatBox');
            const loadDiv = document.createElement('div');
            loadDiv.className = 'message ai';
            loadDiv.id = loadingId;
            loadDiv.innerText = 'O.S.A đang xử lý suy nghĩ...';
            chatBox.appendChild(loadDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Bạn là O.S.A - một hệ thống AI điều khiển toàn năng, hoạt động 24/7. Hãy trả lời ngắn gọn, sắc bén và hữu ích bằng tiếng Việt cho yêu cầu sau: " + text }] }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    appendMessage('ai', aiReply);
                } else {
                    appendMessage('ai', 'Lỗi phản hồi từ hệ thống API. Kiểm tra lại khóa của bạn.');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('ai', 'Lỗi kết nối mạng hoặc API Key không hợp lệ.');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
    </html>
